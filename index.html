<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- ⚠️ noindex placeholder — RETIRAR EN TANDA 12 -->
  <meta name="robots" content="noindex, nofollow" />
  <title>Beauty by Leela — Próximamente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bl-cream:#FAF6F2; --bl-gold:#C6A664; --bl-gold-deep:#A9884E;
      --bl-charcoal:#1C1A19; --bl-muted:#6B625C;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%}
    body{
      background:var(--bl-cream); color:var(--bl-charcoal);
      font-family:'Fraunces',Georgia,serif;
      display:grid; place-items:center; min-height:100svh;
      text-align:center; padding:2rem;
      -webkit-font-smoothing:antialiased;
    }
    .mark{
      font-size:clamp(3.5rem,18vw,7rem); font-weight:600;
      letter-spacing:.04em; color:var(--bl-gold);
      font-variation-settings:'opsz' 144, 'WONK' 0, 'SOFT' 20;
      line-height:1;
    }
    .rule{width:44px;height:1px;background:var(--bl-gold);margin:1.75rem auto;opacity:.7}
    h1{font-size:clamp(1.5rem,6vw,2.25rem);font-weight:400;letter-spacing:.02em;
       font-variation-settings:'opsz' 72,'WONK' 0,'SOFT' 20}
    p{margin-top:1rem;font-family:system-ui,-apple-system,sans-serif;
      font-size:.95rem;color:var(--bl-muted);letter-spacing:.08em;text-transform:uppercase}
  </style>
</head>
<body>
  <main>
    <div class="mark">BL</div>
    <div class="rule"></div>
    <h1>Beauty by Leela</h1>
    <p>Próximamente</p>
  </main>
</body>
</html>
